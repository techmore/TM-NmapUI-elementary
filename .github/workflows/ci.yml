name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # tanit = elementary OS 9, the first release with GTK 4 Wingpanel (wingpanel-9) and WebKitGTK 6.0.
        image: [tanit-unstable]
    container:
      image: ghcr.io/elementary/docker:${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y meson ninja-build valac pkg-config libgtk-4-dev libgranite-7-dev \
            libwebkitgtk-6.0-dev libsoup-3.0-dev libjson-glib-dev \
            desktop-file-utils appstream xvfb python3 python3-pytest
          # The Wingpanel indicator needs wingpanel-9 (elementary OS 9); build it when the image has it.
          if apt-get -o Acquire::Retries=5 install -y libwingpanel-9-dev; then echo "INDICATOR=true" >> "$GITHUB_ENV"; else echo "INDICATOR=false" >> "$GITHUB_ENV"; fi
      - name: Build
        run: |
          meson setup build -Dindicator=$INDICATOR
          meson compile -C build
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate build/data/io.github.techmore.NmapUI.desktop
          appstreamcli validate --no-net build/data/io.github.techmore.NmapUI.metainfo.xml
      - name: Summary helper unit tests
        run: python3 -m pytest -q tests
      - name: Render the indicator for every state
        if: env.INDICATOR == 'true'
        run: indicator/probe/run-probe.sh build/indicator probe-out
      - uses: actions/upload-artifact@v4
        if: env.INDICATOR == 'true'
        with:
          name: indicator-renders-${{ matrix.image }}
          path: probe-out/*.png
