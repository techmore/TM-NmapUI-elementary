name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # tanit = elementary OS 9, the first release with GTK 4 Wingpanel (wingpanel-9) and WebKitGTK 6.0.
        image: [tanit-unstable]
    container:
      image: ghcr.io/elementary/docker:${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y meson ninja-build valac pkg-config libgtk-4-dev libgranite-7-dev \
            libwebkitgtk-6.0-dev libsoup-3.0-dev libjson-glib-dev \
            desktop-file-utils appstream xvfb dbus-x11 python3 python3-pytest libwingpanel-9-dev
      - name: Build
        run: |
          meson setup build -Dindicator=true
          meson compile -C build
          meson test -C build --print-errorlogs
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate build/data/io.github.techmore.NmapUI.desktop
          appstreamcli validate --no-net build/data/io.github.techmore.NmapUI.metainfo.xml
      - name: Summary helper unit tests
        run: python3 -m pytest -q tests
      - name: Render the indicator for every state
        run: dbus-run-session -- indicator/probe/run-probe.sh build/indicator probe-out
      - uses: actions/upload-artifact@v4
        with:
          name: indicator-renders-${{ matrix.image }}
          path: probe-out/*.png
          if-no-files-found: error
      - name: Render the native window offline in both color schemes
        env:
          NMAPUI_URL: http://127.0.0.1:19000
          # GitHub's Docker runner disallows the nested namespaces WebKit needs.
          # Only this isolated offline render disables the WebKit sandbox.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: scripts/snapshot.sh build window-out
      - uses: actions/upload-artifact@v4
        with:
          name: window-renders-${{ matrix.image }}
          path: window-out/*.png
          if-no-files-found: error
