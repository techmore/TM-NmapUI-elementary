name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (elementary OS 8 container)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/elementary/docker:horus-unstable
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y meson ninja-build valac pkg-config libgtk-4-dev libgranite-7-dev \
            libwebkitgtk-6.0-dev libsoup-3.0-dev libjson-glib-dev libwingpanel-9-dev \
            desktop-file-utils appstream xvfb python3 python3-pytest
      - name: Build
        run: |
          meson setup build -Dindicator=true
          meson compile -C build
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate build/data/io.github.techmore.NmapUI.desktop
          appstreamcli validate --no-net build/data/io.github.techmore.NmapUI.metainfo.xml
      - name: Summary helper unit tests
        run: python3 -m pytest -q tests
      - name: Render the indicator for every state
        run: indicator/probe/run-probe.sh build/indicator probe-out
      - uses: actions/upload-artifact@v4
        with:
          name: indicator-renders
          path: probe-out/*.png
